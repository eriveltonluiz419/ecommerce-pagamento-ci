name: CI

on:
  push: 
    branches: [ "feature/*" ]

defaults:
  run:
    working-directory: app

jobs:

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Inicia Banco Mysql
        run: docker compose up -d mysql

#      - name: Lint
#        run: mvn -B checkstyle:check

      - name: Unit Tests
        run: mvn clean test

      - name: Coverage
        run: mvn jacoco:report
      
  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: mvn clean package -DskipTests

      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: target/*.jar
